services:
  gm-api:
    container_name: gm-api
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT}
      HOST: ${HOST}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gm-postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-audio}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      gm-postgres:
        condition: service_healthy
      gm-garage:
        condition: service_started

  gm-postgres:
    container_name: gm-postgres
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - gm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gm-garage:
    container_name: gm-garage
    image: dxflrs/garage:v1.0.1
    ports:
      - "3900:3900"
      - "3902:3902"
      - "3903:3903"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env.docker}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env.docker}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - gm_garage_meta:/var/lib/garage/meta
      - gm_garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gm_postgres_data:
  gm_garage_meta:
  gm_garage_data:
